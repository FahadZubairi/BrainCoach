<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0e0e0d; --surface: #161614; --line: #262624;
      --fg: #edece8; --fg-2: #a8a69f; --fg-3: #8a8881;
      --accent: #9cc9a9; --danger: #e58b7b; --warn: #e3bd7a;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 300px; padding: 18px; background: var(--bg); color: var(--fg);
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.005em;
    }
    .brand { font-family: Georgia, "Times New Roman", serif; font-size: 18px; margin-bottom: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); flex-shrink: 0; }
    .dot.on { background: var(--accent); }
    .dot.off { background: var(--danger); }
    .dot.paused { background: var(--warn); }
    .label { color: var(--fg-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 12px; margin-bottom: 2px; }
    .task { color: var(--fg); }
    .muted { color: var(--fg-2); }
    .reason { color: var(--fg-3); font-size: 12px; }
    .spread { justify-content: space-between; }
    .beat { color: var(--fg-3); font-size: 11px; }
    .log { list-style: none; padding: 0; margin-top: 4px; }
    .log li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }
    .log li:first-child { border-top: 0; }
    .log .host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
    .log .dur { color: var(--fg-3); font-variant-numeric: tabular-nums; font-size: 12px; }
    .dot.neutral { background: var(--fg-3); }
  </style>
</head>
<body>
  <div class="brand">BrainCoach</div>
  <div class="card" id="status">
    <div class="row"><span class="dot"></span><span class="muted">Loading…</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
