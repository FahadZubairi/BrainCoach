<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Break — BrainCoach</title>
  <style>
    :root {
      --bg: #0e0e0d; --surface: #151514; --surface-2: #1c1c1a; --line: #262624; --line-strong: #353532;
      --fg: #edece8; --fg-2: #a8a69f; --fg-3: #8a8881;
      --accent: #9cc9a9; --accent-hover: #b2d8bd; --accent-ink: #0d1a11; --warn: #e3bd7a;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.005em;
      display: flex; align-items: center; justify-content: center; padding: 28px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; text-align: center; animation: rise 0.5s var(--ease) both; }
    .mark { width: 44px; height: 44px; margin: 0 auto 18px; display: block; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); }
    h1 { font-family: "Iowan Old Style", Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1; margin-top: 8px; }
    p.body { color: var(--fg-2); margin-top: 10px; }
    .task { color: var(--fg); }
    .count { font-size: 56px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; margin-top: 14px; }
    .bar { height: 4px; border-radius: 999px; background: var(--line-strong); overflow: hidden; margin: 14px auto 0; max-width: 240px; }
    .bar > span { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
    .actions { margin-top: 24px; display: grid; gap: 8px; }
    button {
      height: 46px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 500; cursor: pointer;
      transition: background-color 150ms, color 150ms, transform 120ms var(--ease);
    }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .primary { background: var(--accent); color: var(--accent-ink); }
    .primary:hover { background: var(--accent-hover); }
    .secondary { background: var(--surface-2); color: var(--fg); border-color: var(--line-strong); }
    .ghost { background: transparent; color: var(--fg-3); height: 38px; }
    .ghost:hover { color: var(--fg); }
    [hidden] { display: none !important; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } .bar > span { transition: none; } }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="icons/icon128.png" alt="">

    <!-- Prompt -->
    <section id="prompt" hidden>
      <p class="eyebrow">Timebox complete</p>
      <h1>Time for a break.</h1>
      <p class="body"><span id="planned"></span> focused minutes on <span class="task" id="task"></span>. Step away for <span id="len"></span>.</p>
      <div class="actions">
        <button class="primary" id="accept" type="button"></button>
        <button class="ghost" id="dismiss" type="button">Not now</button>
      </div>
    </section>

    <!-- Countdown -->
    <section id="break" hidden>
      <p class="eyebrow">On a break</p>
      <div class="count" id="count">0:00</div>
      <div class="bar" aria-hidden="true"><span id="bar"></span></div>
      <p class="body">Stand up, stretch, look at something far away. Your session resumes on its own.</p>
      <div class="actions">
        <button class="secondary" id="continue" type="button">Continue now</button>
      </div>
    </section>

    <!-- Over -->
    <section id="over" hidden>
      <p class="eyebrow" style="color: var(--accent)">Break's over</p>
      <h1>Back to it.</h1>
      <p class="body">Your session has resumed.</p>
      <div class="actions">
        <button class="primary" id="back" type="button">Back to work</button>
      </div>
    </section>
  </main>
  <script src="break.js"></script>
</body>
</html>
