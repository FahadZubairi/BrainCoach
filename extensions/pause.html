<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pause — BrainCoach</title>
  <style>
    :root {
      --bg: #0e0e0d; --surface: #151514; --surface-2: #1c1c1a; --line: #262624; --line-strong: #353532;
      --fg: #edece8; --fg-2: #a8a69f; --fg-3: #8a8881;
      --accent: #9cc9a9; --accent-hover: #b2d8bd; --accent-ink: #0d1a11; --warn: #e3bd7a;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.005em;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 460px; text-align: center; animation: rise 0.6s var(--ease) both; }
    .serif { font-family: "Iowan Old Style", Georgia, "Times New Roman", serif; font-weight: 400; }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); }
    h1 { font-size: 44px; line-height: 1.05; margin-top: 10px; }
    .site { color: var(--fg-2); margin-top: 10px; }
    .site b { color: var(--fg); font-weight: 500; }

    /* Breathing guide: 4s in, 6s out — a slow exhale down-regulates arousal */
    .breath { position: relative; width: 168px; height: 168px; margin: 40px auto 8px; }
    .breath .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--line-strong); }
    .breath .orb {
      position: absolute; inset: 34px; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgb(156 201 169 / 0.45), rgb(156 201 169 / 0.12) 70%);
      animation: breathe 10s var(--ease) 1 both;
    }
    .breath .count {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 200; font-variant-numeric: tabular-nums;
    }
    .cue { color: var(--fg-3); font-size: 13px; height: 20px; }

    .card { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; text-align: left; }
    .card + .card { margin-top: 10px; }
    .card p + p { margin-top: 4px; }
    .task { font-size: 20px; line-height: 1.3; }
    .plan { font-size: 18px; line-height: 1.35; }

    .actions { margin-top: 28px; display: grid; gap: 10px; }
    button {
      height: 48px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 500; cursor: pointer;
      transition: background-color 150ms, border-color 150ms, color 150ms, transform 120ms var(--ease), opacity 200ms;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .primary { background: var(--accent); color: var(--accent-ink); }
    .primary:hover { background: var(--accent-hover); }
    .secondary { background: var(--surface-2); color: var(--fg); border-color: var(--line-strong); }
    .secondary:hover:not(:disabled) { border-color: var(--fg-3); }
    .ghost { background: transparent; color: var(--fg-3); height: 40px; }
    .ghost:hover:not(:disabled) { color: var(--fg); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes breathe {
      0% { transform: scale(0.55); }
      40% { transform: scale(1); }
      100% { transform: scale(0.55); }
    }
    @media (prefers-reduced-motion: reduce) {
      main, .breath .orb { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A moment before you go</p>
    <h1 class="serif">Pause.</h1>
    <p class="site">You were heading to <b id="host">this site</b>.</p>

    <div class="breath" aria-hidden="true">
      <div class="ring"></div>
      <div class="orb"></div>
      <div class="count" id="count">10</div>
    </div>
    <p class="cue" id="cue" aria-live="polite">Breathe in…</p>

    <div class="card" id="task-card" hidden>
      <p class="eyebrow">You're working on</p>
      <p class="task serif" id="task"></p>
    </div>
    <div class="card" id="plan-card" hidden>
      <p class="eyebrow">Your plan</p>
      <p class="plan serif" id="plan"></p>
    </div>

    <div class="actions">
      <button class="primary" id="back" type="button">Back to work</button>
      <div class="row">
        <button class="secondary" id="allow" type="button" disabled>It's for my task</button>
        <button class="secondary" id="snooze" type="button" disabled>5 more minutes</button>
      </div>
    </div>
  </main>
  <script src="pause.js"></script>
</body>
</html>
